<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flag Survival Arena</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:white;font:14px Arial;text-align:center}.wrap{max-width:720px;margin:auto;padding:12px}.panel{background:#111629;border:2px solid #e43d7b;border-radius:16px;padding:12px}.top{border:2px solid #d93875;border-radius:12px;padding:10px;margin-bottom:10px}.pink{color:#ff6b9d;font-weight:bold;letter-spacing:1px;font-size:12px}.qual{font-size:22px;min-height:30px;margin-top:5px}.arena{width:100%;aspect-ratio:1;background:radial-gradient(circle,#20283c,#090d18 72%);border-radius:12px}canvas{width:100%;height:100%}.bar{height:10px;background:#33394d;border-radius:20px;margin:12px 5px 5px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ff3979,#ffc84c)}button,select{padding:10px 13px;border-radius:9px;background:#252e43;color:white;border:1px solid #58647f;font-weight:bold;margin:4px}.go{background:#ffcf4b;color:#17121a;border:0}.winner{font-size:30px;color:#ffdc62;font-weight:bold;min-height:38px;margin:8px}.small{color:#9ba8bd;font-size:12px}
</style></head><body><main class="wrap"><h1>🌍 FLAG SURVIVAL ARENA</h1><p class="small">BOUNCE • COLLIDE • ESCAPE • LAST FLAG WINS</p><section class="panel"><div class="top"><div class="pink" id="round">ROUND 1 • SURVIVAL</div><div class="pink" style="color:white;margin-top:5px">QUALIFIED FOR FINAL</div><div class="qual" id="qual">—</div></div><div class="arena"><canvas id="c" width="900" height="900"></canvas></div><div class="bar"><div class="fill" id="fill"></div></div><b id="count">193 / 193 FLAGS</b><p class="small" id="msg">Ready! Start the battle.</p><div class="winner" id="win"></div></section><p>Flags <select id="num"><option>50</option><option>100</option><option selected>193</option><option>249</option></select> Exit <select id="batch"><option value="random">Random 2 / 4</option><option value="2">2 flags</option><option value="4">4 flags</option></select></p><button class="go" id="start">▶ START</button><button id="pause" disabled>Ⅱ PAUSE</button><button id="reset">↻ RESET</button><p class="small">All flags bounce inside the circle. The opening on the right is the only exit.</p></main>
<script>
const codes=["AF","AL","DZ","AD","AO","AG","AR","AM","AU","AT","AZ","BS","BH","BD","BB","BY","BE","BZ","BJ","BT","BO","BA","BW","BR","BN","BG","BF","BI","KH","CM","CA","CF","TD","CL","CN","CO","KM","CG","CR","CI","HR","CU","CY","CZ","KP","CD","DK","DJ","DM","DO","EC","EG","SV","GQ","ER","EE","SZ","ET","FJ","FI","FR","GA","GM","GE","DE","GH","GR","GD","GT","GN","GW","GY","HT","HN","HU","IS","IN","ID","IR","IQ","IE","IL","IT","JM","JP","JO","KZ","KE","KW","KG","LA","LV","LB","LS","LR","LY","LI","LT","LU","MG","MW","MY","MV","ML","MT","MH","MR","MU","MX","FM","MC","MN","ME","MA","MZ","MM","NA","NR","NP","NL","NZ","NI","NE","NG","MK","NO","OM","PK","PW","PS","PA","PG","PY","PE","PH","PL","PT","QA","KR","MD","RO","RU","RW","KN","LC","VC","WS","SM","ST","SA","SN","RS","SC","SL","SG","SK","SI","SB","SO","ZA","SS","ES","LK","SD","SR","SE","CH","SY","TJ","TZ","TH","TL","TG","TO","TT","TN","TR","TM","TV","UG","UA","AE","GB","US","UY","UZ","VU","VA","VE","VN","YE","ZM","ZW"];
const names=["Afghanistan","Albania","Algeria","Andorra","Angola","Antigua and Barbuda","Argentina","Armenia","Australia","Austria","Azerbaijan","Bahamas","Bahrain","Bangladesh","Barbados","Belarus","Belgium","Belize","Benin","Bhutan","Bolivia","Bosnia","Botswana","Brazil","Brunei","Bulgaria","Burkina Faso","Burundi","Cambodia","Cameroon","Canada","Central African Republic","Chad","Chile","China","Colombia","Comoros","Congo","Costa Rica","Côte d’Ivoire","Croatia","Cuba","Cyprus","Czechia","North Korea","DR Congo","Denmark","Djibouti","Dominica","Dominican Republic","Ecuador","Egypt","El Salvador","Equatorial Guinea","Eritrea","Estonia","Eswatini","Ethiopia","Fiji","Finland","France","Gabon","Gambia","Georgia","Germany","Ghana","Greece","Grenada","Guatemala","Guinea","Guinea-Bissau","Guyana","Haiti","Honduras","Hungary","Iceland","India","Indonesia","Iran","Iraq","Ireland","Israel","Italy","Jamaica","Japan","Jordan","Kazakhstan","Kenya","Kuwait","Kyrgyzstan","Laos","Latvia","Lebanon","Lesotho","Liberia","Libya","Liechtenstein","Lithuania","Luxembourg","Madagascar","Malawi","Malaysia","Maldives","Mali","Malta","Marshall Islands","Mauritania","Mauritius","Mexico","Micronesia","Monaco","Mongolia","Montenegro","Morocco","Mozambique","Myanmar","Namibia","Nauru","Nepal","Netherlands","New Zealand","Nicaragua","Niger","Nigeria","North Macedonia","Norway","Oman","Pakistan","Palau","Palestine","Panama","Papua New Guinea","Paraguay","Peru","Philippines","Poland","Portugal","Qatar","South Korea","Moldova","Romania","Russia","Rwanda","Saint Kitts","Saint Lucia","Saint Vincent","Samoa","San Marino","Sao Tome","Saudi Arabia","Senegal","Serbia","Seychelles","Sierra Leone","Singapore","Slovakia","Slovenia","Solomon Islands","Somalia","South Africa","South Sudan","Spain","Sri Lanka","Sudan","Suriname","Sweden","Switzerland","Syria","Tajikistan","Tanzania","Thailand","Timor-Leste","Togo","Tonga","Trinidad and Tobago","Tunisia","Türkiye","Turkmenistan","Tuvalu","Uganda","Ukraine","UAE","United Kingdom","United States","Uruguay","Uzbekistan","Vanuatu","Vatican City","Venezuela","Vietnam","Yemen","Zambia","Zimbabwe"];
const emoji=cc=>String.fromCodePoint(...cc.toUpperCase().split("").map(x=>127397+x.charCodeAt(0)));
const c=document.getElementById("c"),x=c.getContext("2d"),cx=450,cy=450,R=340,gate=.64;let f=[],escaped=[],exiting=[],run=false,paused=false,raf,last=0,tick=0,round=1,ringAngle=0;
const $=id=>document.getElementById(id),rand=(a,b)=>a+Math.random()*(b-a);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function init(){cancelAnimationFrame(raf);run=paused=false;escaped=[];exiting=[];round=1;ringAngle=0;let n=+$("num").value;f=[];let order=shuffle(codes.map((cc,i)=>({flag:emoji(cc),name:names[i]||cc}))).slice(0,n),r=n>200?10:n>130?11:13;order.forEach(o=>{let px,py,k=0;do{px=rand(cx-R+r,cx+R-r);py=rand(cy-R+r,cy+R-r);k++}while((Math.hypot(px-cx,py-cy)>R-r-2||f.some(q=>Math.hypot(px-q.x,py-q.y)<r*1.8))&&k<400);let a=rand(0,6.28),v=rand(2.8,5.0);f.push({...o,x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r,rot:rand(0,6.28),spin:rand(-.1,.1)})});$("qual").textContent="—";$("round").textContent="ROUND 1 • SURVIVAL";$("win").textContent="";$("msg").textContent="Flags are ready. Start the battle!";$("start").disabled=false;$("pause").disabled=true;update();draw()}
function update(){$("count").textContent=f.length+" / "+$("num").value+" FLAGS";$("fill").style.width=(100*f.length/+$("num").value)+"%"}
function norm(a){while(a>Math.PI)a-=6.283;while(a< -Math.PI)a+=6.283;return a}
function physics(dt){for(let s=0;s<2;s++){for(let a of f){a.x+=a.vx*dt/2;a.y+=a.vy*dt/2;a.rot+=a.spin*dt}for(let i=0;i<f.length;i++)for(let j=i+1;j<f.length;j++){let a=f[i],b=f[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;if(d&&d<m){let nx=dx/d,ny=dy/d,o=m-d;a.x-=nx*o*.51;a.y-=ny*o*.51;b.x+=nx*o*.51;b.y+=ny*o*.51;let v=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(v<0){a.vx+=v*nx;a.vy+=v*ny;b.vx-=v*nx;b.vy-=v*ny}}}for(let i=f.length-1;i>=0;i--){let a=f[i],dx=a.x-cx,dy=a.y-cy,d=Math.hypot(dx,dy),ang=Math.atan2(dy,dx);if(d>R-a.r){if(Math.abs(norm(ang))<gate/2&&d>R+a.r*.3){escaped.push(a);f.splice(i,1);continue}let nx=dx/d,ny=dy/d;a.x=cx+nx*(R-a.r);a.y=cy+ny*(R-a.r);let v=a.vx*nx+a.vy*ny;if(v>0){a.vx-=2*v*nx;a.vy-=2*v*ny}}let sp=Math.hypot(a.vx,a.vy);if(sp<1.2){let z=rand(0,6.28);a.vx=Math.cos(z)*1.5;a.vy=Math.sin(z)*1.5}}}}
function draw(now=performance.now()){
 x.clearRect(0,0,900,900);
 // The circular arena has a fixed open exit, with moving lights around its rim.
 x.beginPath();x.arc(cx,cy,R,gate/2,Math.PI*2-gate/2);
 x.strokeStyle="#fff";x.lineWidth=10;x.shadowColor="#ff4d8b";x.shadowBlur=17;x.stroke();x.shadowBlur=0;
 x.save();x.translate(cx,cy);x.rotate(ringAngle);
 for(let k=0;k<36;k++){let a=k*Math.PI*2/36;x.beginPath();x.arc(0,0,R+7,a,a+.035);x.strokeStyle=k%3===0?"#ffd34f":"#e94b87";x.lineWidth=5;x.stroke()}
 x.restore();
 x.fillStyle="#ffd44d";x.font="bold 38px Arial";x.textAlign="center";x.fillText("➜",cx+R+45,cy+12);
 x.fillStyle="#ffffff18";x.beginPath();x.arc(cx,cy,68,0,6.28);x.fill();
 x.fillStyle="#dce5f5";x.font="bold 20px Arial";x.fillText("SURVIVE",cx,cy+6);
 for(let a of f){x.save();x.translate(a.x,a.y);x.rotate(a.rot);x.font=(a.r*2.2)+'px Arial';x.textAlign="center";x.textBaseline="middle";x.shadowColor="#000";x.shadowBlur=4;x.fillText(a.flag,0,0);x.restore()}
 // Show each eliminated flag visibly travelling through the gate.
 exiting=exiting.filter(e=>now-e.start<620);
 for(let e of exiting){let p=Math.min(1,(now-e.start)/620),ease=p*p*(3-2*p);
  let xx=e.sx+(cx+R+100-e.sx)*ease, yy=e.sy+(cy-e.sy)*ease;
  x.globalAlpha=1-p*.8;x.font="34px Arial";x.textAlign="center";x.fillText(e.flag,xx,yy);x.globalAlpha=1;
 }
}
function batchOut(){
 if(f.length<=1)return;
 let n=$("batch").value==="random"?(Math.random()<.65?2:3):+$("batch").value;
 n=Math.min(n,f.length-1);
 let gone=shuffle(f).slice(0,n),now=performance.now();
 gone.forEach((a,i)=>{
   // Send the selected flags toward the currently open gate.
   let side=Math.random()<.5?-1:1;
   let sy=cy+rand(-R*.22,R*.22);
   exiting.push({flag:a.flag,sx:cx+R*.65,sy,start:now+i*90});
 });
 f=f.filter(a=>!gone.includes(a));round++;
 $("round").textContent="ROUND "+round+" • "+n+" FLAGS EXITING";
 $("qual").textContent=gone.map(a=>a.flag+" "+a.name).join(" • ");
 $("msg").textContent=n+" flags are escaping through the spinning arena gate!";
 update();
 if(f.length===1){
  $("start").disabled=false;$("pause").disabled=true;
  $("round").textContent="FINAL CHAMPION";
  $("qual").textContent=f[0].flag+" "+f[0].name;
  $("win").textContent="🏆 WINNER: "+f[0].name+" "+f[0].flag;
  $("msg").textContent="The last flag remaining is the champion!";
 }
}
function frame(t){
 if(!run)return;
 let dt=Math.min(2.8,(t-last)/16.67||1);last=t;tick+=dt;
 ringAngle+=.018*dt;
 physics(dt);
 if(tick>105){batchOut();tick=0}
 draw(t);
 if(f.length<=1&&run){run=false;$("start").disabled=false;$("pause").disabled=true}
 if(run)raf=requestAnimationFrame(frame);
}
$("start").onclick=()=>{if(run)return;if(f.length<=1)init();run=true;paused=false;last=performance.now();$("start").disabled=true;$("pause").disabled=false;$("msg").textContent="Flags are bouncing and colliding!";raf=requestAnimationFrame(frame)};
$("pause").onclick=()=>{if(run){run=false;paused=true;cancelAnimationFrame(raf);$("pause").textContent="▶ RESUME";$("msg").textContent="Battle paused."}else if(paused){run=true;paused=false;last=performance.now();$("pause").textContent="Ⅱ PAUSE";raf=requestAnimationFrame(frame)}};
$("reset").onclick=init;$("num").onchange=init;init();
</script></body></html>
